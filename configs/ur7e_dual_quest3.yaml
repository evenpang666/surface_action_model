schema_version: 1
scene: ur7e_dual_quest3
coordinate_frame: left_base

# Paths are resolved relative to this repository.
quest3:
  hardware_config: configs/hardware/hardware_dual_teleop.yaml
  data_globs:
    - ../quest3_collect/data/left_vr_episodes/*.hdf5
    - ../quest3_collect/data/dual_vr_episodes/*.hdf5
  front_camera: front
  camera_to_model:
    front: base_0_rgb

robot:
  arm_order: [left_arm, right_arm]
  joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  tools:
    left_arm: robotiq_2f85
    right_arm: robotiq_2f85
  # ^flange T_active_tcp, receive-only measurements: left 2026-09-10, right 2026-10-08.
  flange_to_active_tcp:
    left_arm:
      source: measured_receive_only_rtde_2026-09-10
      verified: true
      matrix:
        - [0.9999984051565306, -0.0000939596446073407, 0.0017834954388077516, 0.0007995585511560085]
        - [0.0000956716033822228, 0.9999995347879068, -0.000959828585800899, -0.0005245842345504986]
        - [-0.0017834044239512998, 0.0009599976848928029, 0.9999979489344493, 0.18298864323189268]
        - [0.0, 0.0, 0.0, 1.0]
    right_arm:
      source: measured_receive_only_rtde_2026-10-08
      measured_at_utc: '2026-10-08T13:33:38.900603+00:00'
      measurement_file: outputs/calibration/dual_flange_to_active_tcp_20261008.json
      sample_count: 30
      translation_max_spread_mm: 2.8310626692637043e-05
      rotation_max_spread_deg: 3.943111961351375e-06
      verified: true
      matrix:
        - [0.9999992884322433, 0.0011457863036181753, -0.00033212761599977635, -0.0006546365299157156]
        - [-0.0011463193722683147, 0.9999980480678009, -0.0016092894347427308, -0.0005553481426067153]
        - [0.0003302830659163028, 0.001609669013944544, 0.9999986499384695, 0.1801257229032101]
        - [0.0, 0.0, 0.0, 1.0]

preprocess:
  points_per_link: 128
  future_horizon: 8
  task_text: manipulate the tabletop instruments safely
  action_source: commanded

model:
  backbone: pi05_base
  framework: pytorch
  pretrained: outputs/pretrained/pi05_base_pytorch/model.safetensors
  source_checkpoint: ~/.cache/openpi/openpi-assets/checkpoints/pi05_base

safety:
  # Validated aggregate and four source hashes from the 2026-10-17 sessions.
  camera_calibration_valid: true
  dual_arm_camera_calibration: configs/hardware/calibration/dual_arm_camera_transforms.yaml
  front_calibration: configs/hardware/calibration/left_base_to_front_camera.yaml
  right_front_calibration: configs/hardware/calibration/right_base_to_front_camera.yaml
  side_calibration: configs/hardware/calibration/left_base_to_side_camera.yaml
  right_side_calibration: configs/hardware/calibration/right_base_to_side_camera.yaml
  max_camera_skew_s: 0.10
  policy_host: 192.168.124.64
  max_state_drift_rad: 0.01
  obstacle_url: http://127.0.0.1:8766/snapshot.json
  stale_timeout_s: 2.0
  collision_margin_m: 0.0  # Envelope ellipsoids already include geometric expansion.
  trigger_margin_m: 0.025
  max_joint_step_rad: 0.015
  cbf_alpha: 1.0
  cbf_iterations: 64
  inter_arm_margin_m: 0.035
  # Ellipsoid replay: left/environment, right/environment, left/right only.
  # No same-arm collision avoidance.
  ellipsoid_mcbf:
    max_control_step_rad: 0.04
    alpha_per_s: 20.0
    collision_slack_weight: 20000.0
    stagnation_steps: 80
    obstacle_max_parts: 8
    obstacle_max_span_m: 0.20
    # VLSA Eq. (9): two virtual plane-direction coordinates per ellipsoid pair.
    virtual_direction_step_rad: 0.25
    virtual_direction_weight: 0.01
  # Legacy point/box AdaptiveMCBF configuration; ellipsoid replay uses the block above.
  adaptive_mcbf:
    geodesic_candidates: 16
    geodesic_horizon: 96
    geodesic_step_m: 0.02
    guidance_speed_m_s: 0.12
    narrow_width_m: 0.10
    dynamic_distance_m: 0.35
    closing_speed_m_s: 0.03
    narrow_margin_scale: 0.25
    dynamic_margin_scale: 2.0
    narrow_alpha_scale: 2.0
    dynamic_alpha_scale: 0.5
    max_control_step_rad: 0.04
