[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-action-model"
version = "0.4.0"
requires-python = ">=3.11,<3.13"
description = "Four-view PI0.5 actions with front/side SAM 3 boxes and dual-UR7e perception runtime"
dependencies = ["numpy>=1.24,<2", "PyYAML>=6", "scipy>=1.11", "h5py>=3.8", "osqp>=1.0,<2"]

[project.optional-dependencies]
octomap = ["octomap-python==1.10.0.0"]

[tool.setuptools.packages.find]
include = ["safety_module*", "real_scripts*", "obstacle_validation*"]
exclude = ["real_scripts.ur7e_robotiq_d435i_collector.pika_sdk*"]
