<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务数据集 · 双视角障碍物标注</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d141d;color:#e6edf3;font:15px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 12px}p{color:#afbed0;line-height:1.6}
button,select,input{background:#1d2b3d;color:#e6edf3;border:1px solid #52647a;border-radius:6px;padding:9px}button{cursor:pointer}button.primary{background:#287b69}button:disabled{opacity:.45;cursor:default}
.toolbar,.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}.toolbar input[type=number]{width:90px}#object{width:80px}#episode{max-width:420px}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}.view{padding:16px;background:#15202d;border-radius:10px;min-width:0}canvas{width:100%;height:auto;display:block;background:#070b10;cursor:crosshair;touch-action:none;margin:12px 0}canvas.reference{cursor:default;touch-action:auto}.controls input{width:150px}#status{white-space:pre-wrap;padding:14px;border:1px solid #34475d;border-radius:8px;line-height:1.7;overflow-wrap:anywhere}.warning{color:#ffd166}#progress{color:#69dec3}.legend{color:#afbed0;font-size:13px}@media(max-width:850px){.views{grid-template-columns:1fr}}
</style></head><body><main>
<h1>任务数据集 · 双视角障碍物 OBB 标注</h1>
<p>逐帧标注任务目录内全部 HDF5。两视角的同一障碍物使用相同编号，红框坐标以各自录制的 RGB 像素为准。深度图无需人工标注。点击保存后直接写回当前原 HDF5，已保存的标注可在下次启动时继续。</p>
<div id="progress">正在读取任务目录…</div><div id="provenance" class="warning"></div>
<div class="toolbar"><label>文件 <select id="episode"></select></label><label>帧索引（从 0 开始） <input id="frame-index" type="number" min="0" value="0"></label><button id="go">跳转</button><button id="resume">跳到首个未标注帧</button></div>
<div class="toolbar"><button id="previous">上一帧 ←</button><button id="next">下一帧 →</button><button id="copy">复制上一帧已保存框</button><label>障碍物编号 <input id="object" value="1" maxlength="64"></label><button id="save" class="primary">保存当前帧</button><button id="save-next" class="primary">保存并下一帧（Enter）</button><button id="empty">标记无障碍并下一帧</button></div>
<div class="legend" id="legend"></div><div class="views">
<section class="view"><b id="front-title">front RGB（在此标注）</b><canvas id="front" width="640" height="480"></canvas><div class="controls"><label>旋转 <input id="front-angle" type="range" min="-180" max="180" value="0"></label><span id="front-angle-label">0°</span><button id="front-delete">删除选中框</button><button id="front-clear">清空此视角</button></div></section>
<section class="view"><b id="side-title">side RGB（在此标注）</b><canvas id="side" width="640" height="480"></canvas><div class="controls"><label>旋转 <input id="side-angle" type="range" min="-180" max="180" value="0"></label><span id="side-angle-label">0°</span><button id="side-delete">删除选中框</button><button id="side-clear">清空此视角</button></div></section>
</div><p>拖动画框；点击框后旋转；同一编号可以包含多个框。复制上一帧后需要逐帧检查并保存，不会自动标记后续帧。没有障碍物时使用专门按钮，区别于“尚未标注”。</p><div id="status" role="status">等待首帧…</div>
</main><script>
const $=id=>document.getElementById(id),views=Object.fromEntries(['front','side'].map(name=>[name,{canvas:$(name),image:null,boxes:[],selected:-1,start:null}]));
let manifest=null,current=null,busy=false,dirty=false;
function setBusy(value){busy=value;for(const button of document.querySelectorAll('button'))button.disabled=value;$('episode').disabled=value;$('frame-index').disabled=value}
function changed(){dirty=true;$('status').textContent=`${current.filename} · 帧 ${current.frame_index} · 有未保存修改`}
async function get(path){const response=await fetch(path,{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||response.status);return data}
async function refreshManifest(){manifest=await get('/api/manifest');const selected=current?.episode_id??0;$('episode').replaceChildren(...manifest.episodes.map(e=>{const option=document.createElement('option');option.value=e.episode_id;option.textContent=`${e.relative_path} (${e.reviewed_count}/${e.frame_count})`;return option}));$('episode').value=selected;$('progress').textContent=`${manifest.task_dir} · ${manifest.episodes.length} 个文件 · 已标注 ${manifest.reviewed_frames}/${manifest.total_frames} 帧`}
function contains(b,p){const a=b.angle_deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),x=p.x-b.cx,y=p.y-b.cy;return Math.abs(c*x+s*y)<=b.width/2&&Math.abs(-s*x+c*y)<=b.height/2}
function point(v,e){const r=v.canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(v.canvas.width-1,(e.clientX-r.left)*v.canvas.width/r.width)),y:Math.max(0,Math.min(v.canvas.height-1,(e.clientY-r.top)*v.canvas.height/r.height))}}
function redraw(name){const v=views[name],ctx=v.canvas.getContext('2d');ctx.clearRect(0,0,v.canvas.width,v.canvas.height);if(v.image)ctx.drawImage(v.image,0,0);for(const [index,b] of v.boxes.entries()){ctx.save();ctx.translate(b.cx,b.cy);ctx.rotate(b.angle_deg*Math.PI/180);ctx.strokeStyle='#ff0000';ctx.fillStyle='#ff0000';ctx.lineWidth=Math.max(index===v.selected?4:3,v.canvas.width/(index===v.selected?220:320));ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.strokeRect(-b.width/2,-b.height/2,b.width,b.height);ctx.font=`bold ${Math.max(16,v.canvas.width/50)}px sans-serif`;ctx.fillText(b.object_id,-b.width/2+3,-b.height/2+20);ctx.restore()}
 const rgbctx=v.reference.getContext('2d');rgbctx.clearRect(0,0,v.reference.width,v.reference.height);if(v.rgb)rgbctx.drawImage(v.rgb,0,0)}
function updateAngle(name){const v=views[name],angle=v.boxes[v.selected]?.angle_deg||0;$(name+'-angle').value=angle;$(name+'-angle-label').textContent=angle+'°';redraw(name)}
for(const [name,v] of Object.entries(views)){
 v.canvas.addEventListener('pointerdown',e=>{if(!current||busy)return;v.start=point(v,e);v.canvas.setPointerCapture(e.pointerId)});
 v.canvas.addEventListener('pointerup',e=>{if(!v.start)return;const p=point(v,e),start=v.start;v.start=null;if(Math.hypot(p.x-start.x,p.y-start.y)<5){v.selected=v.boxes.findLastIndex(b=>contains(b,p));updateAngle(name);return}const object_id=$('object').value.trim();if(!object_id){$('status').textContent='请填写障碍物编号';return}const width=Math.abs(p.x-start.x),height=Math.abs(p.y-start.y);if(width<2||height<2)return;v.boxes.push({object_id,cx:(p.x+start.x)/2,cy:(p.y+start.y)/2,width,height,angle_deg:0});v.selected=v.boxes.length-1;changed();updateAngle(name)});
 v.canvas.addEventListener('pointermove',e=>{if(!v.start)return;redraw(name);const p=point(v,e),ctx=v.canvas.getContext('2d');ctx.strokeStyle='#ff0000';ctx.lineWidth=4;ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.strokeRect(v.start.x,v.start.y,p.x-v.start.x,p.y-v.start.y);ctx.shadowBlur=0});
 v.canvas.addEventListener('pointercancel',()=>{v.start=null;redraw(name)});
 $(name+'-angle').addEventListener('input',e=>{if(busy)return;const box=v.boxes[v.selected];if(box){box.angle_deg=Number(e.target.value);changed()}updateAngle(name)});
 $(name+'-delete').onclick=()=>{if(busy)return;if(v.selected>=0){v.boxes.splice(v.selected,1);changed()}v.selected=v.boxes.length-1;updateAngle(name)};
 $(name+'-clear').onclick=()=>{if(busy||!current)return;v.boxes=[];v.selected=-1;changed();updateAngle(name)};
}
async function image(url){if(!url)return null;const result=new Image();result.src=url;await result.decode();return result}
async function load(episode_id,frame_index){if(busy)return;if(dirty&&!confirm('当前框尚未保存，确定丢弃修改并跳转？')){if(current){$('episode').value=current.episode_id;$('frame-index').value=current.frame_index}return}setBusy(true);try{const data=await get(`/api/frame?episode_id=${episode_id}&frame_index=${frame_index}`);const decoded=await Promise.all(Object.keys(views).map(async name=>({name,rgb:await image(data.images[name])})));current=data;dirty=false;
 for(const {name,rgb} of decoded){const v=views[name];v.image=rgb;v.canvas.width=rgb.naturalWidth;v.canvas.height=rgb.naturalHeight;v.boxes=structuredClone(data.boxes[name]);v.selected=v.boxes.length-1;updateAngle(name)}
 $('episode').value=episode_id;$('frame-index').value=frame_index;$('frame-index').max=data.frame_count-1;$('legend').textContent='双视角 OBB 使用各自录制 RGB 的像素坐标；深度用于后续空间重建。';
 $('provenance').textContent='RGB 标注不会修改原图或原生深度；旧版深度像素框须重新标注。';
 $('status').textContent=`${data.filename} · 帧 ${frame_index}/${data.frame_count-1} · ${data.reviewed?'已保存，可修改':'尚未标注'}\n原 Sample 时间戳：${data.timestamp_ns}\nfront/side 深度时间戳：${data.source_timestamps_ns.front??'未记录'} / ${data.source_timestamps_ns.side??'未记录'}`;
}catch(e){$('status').textContent='读取失败：'+e.message;if(current){$('episode').value=current.episode_id;$('frame-index').value=current.frame_index}}finally{setBusy(false)}}
function neighbor(direction){if(!current)return null;let e=current.episode_id,f=current.frame_index+direction;if(f<0){if(e===0)return null;e--;f=manifest.episodes[e].frame_count-1}else if(f>=current.frame_count){if(e===manifest.episodes.length-1)return null;e++;f=0}return [e,f]}
async function navigate(direction){const destination=neighbor(direction);if(destination)await load(...destination)}
async function save(advance=false,empty=false){if(busy||!current)return;const boxes=empty?{front:[],side:[]}:Object.fromEntries(Object.entries(views).map(([name,v])=>[name,v.boxes]));const ids=Object.fromEntries(Object.entries(boxes).map(([name,b])=>[name,new Set(b.map(x=>x.object_id))]));if(!empty&&(!ids.front.size||ids.front.size!==ids.side.size||[...ids.front].some(id=>!ids.side.has(id)))){$('status').textContent='同一障碍物必须在两路使用相同编号标注；无障碍帧请使用“标记无障碍”按钮。';return}if(empty&&Object.values(views).some(v=>v.boxes.length)&&!confirm('此操作将当前帧保存为无障碍，清空该帧两路标注，是否继续？'))return;
 setBusy(true);let saved=false;try{const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode_id:current.episode_id,frame_index:current.frame_index,revision:current.revision,status:empty?'no_obstacles':'objects',boxes})});const result=await response.json();if(!response.ok)throw Error(result.error||response.status);current.revision=result.revision;current.reviewed=true;dirty=false;saved=true;if(empty)for(const [name,v] of Object.entries(views)){v.boxes=[];v.selected=-1;updateAngle(name)}$('status').textContent=`已写回 ${current.filename} · 原帧索引 ${current.frame_index} · ${empty?'无障碍物':'双视角 OBB'}。`;await refreshManifest()}catch(e){$('status').textContent='保存失败：'+e.message}finally{setBusy(false)}if(saved&&advance){const next=neighbor(1);if(next)await load(...next);else $('status').textContent+='\n已到全部文件的最后一帧。'}}
$('save').onclick=()=>save();$('save-next').onclick=()=>save(true);$('empty').onclick=()=>save(true,true);$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);
$('go').onclick=()=>load(Number($('episode').value),Number($('frame-index').value));$('episode').onchange=()=>{const e=manifest.episodes[Number($('episode').value)];load(e.episode_id,e.first_unreviewed??0)};
$('resume').onclick=async()=>{if(busy)return;try{await refreshManifest();const e=manifest.episodes.find(x=>x.first_unreviewed!==null);if(e)await load(e.episode_id,e.first_unreviewed);else $('status').textContent='全部帧均已标注，可按文件与帧索引回看。'}catch(e){$('status').textContent=e.message}};
$('copy').onclick=async()=>{if(busy||!current)return;if(current.frame_index===0){$('status').textContent='当前文件没有上一帧。';return}if(dirty&&!confirm('用上一帧已保存框替换当前未保存修改？'))return;setBusy(true);try{const previous=await get(`/api/frame?episode_id=${current.episode_id}&frame_index=${current.frame_index-1}`);if(!previous.reviewed)throw Error('上一帧尚未保存，请先完成上一帧标注。');for(const [name,v] of Object.entries(views)){v.boxes=structuredClone(previous.boxes[name]);v.selected=v.boxes.length-1;updateAngle(name)}changed()}catch(e){$('status').textContent='复制失败：'+e.message}finally{setBusy(false)}};
document.addEventListener('keydown',e=>{if(e.repeat||busy||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Enter'){e.preventDefault();save(true)}else if(e.code==='ArrowRight'){e.preventDefault();navigate(1)}else if(e.code==='ArrowLeft'){e.preventDefault();navigate(-1)}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function init(){setBusy(true);try{await refreshManifest()}catch(e){$('status').textContent='初始化失败：'+e.message}finally{setBusy(false)}if(manifest){const e=manifest.episodes.find(x=>x.first_unreviewed!==null)||manifest.episodes[0];await load(e.episode_id,e.first_unreviewed??0)}}init();
</script></body></html>
